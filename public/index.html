<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Małopolska 4X — Najazdy tatarskie</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1>Małopolska 4X — Najazdy tatarskie</h1>
      <div id="hud-stats">
        <span id="hud-turn">Tura —</span>
        <span id="hud-gold">Złoto —</span>
        <span id="hud-status"></span>
        <button id="end-turn-btn">Zakończ turę</button>
      </div>
    </header>
    <main id="board-wrap">
      <svg id="hex-map" role="img" aria-label="Mapa Małopolski"></svg>
      <aside id="side-panel" hidden></aside>
    </main>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
