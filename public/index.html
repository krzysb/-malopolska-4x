<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Małopolska 4X — Najazdy tatarskie</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1>Małopolska 4X — Najazdy tatarskie</h1>
      <div id="hud-stats">
        <span id="hud-turn">Czas —</span>
        <span id="hud-gold">Złoto —</span>
        <span id="hud-status"></span>
        <button id="new-game-btn" title="Rozpocznij misję od nowa">Nowa gra</button>
        <button id="speed-btn" title="Przełącz prędkość symulacji">1×</button>
        <button id="pause-btn" title="Wstrzymaj/wznów symulację">Pauza</button>
      </div>
    </header>
    <main id="board-wrap">
      <svg id="hex-map" role="img" aria-label="Mapa Małopolski"></svg>
      <aside id="side-panel" hidden></aside>
    </main>
    <footer id="event-log">
      <h2>Kronika</h2>
      <ul id="event-log-list"></ul>
    </footer>
  </div>
  <div id="end-screen" hidden></div>
  <div id="briefing" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
