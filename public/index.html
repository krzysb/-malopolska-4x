<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Małopolska 4X — Najazdy tatarskie</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <!-- Sprite z ikonami (linia, styl "Feather") - jeden zestaw <symbol>, używany
       przez <use href="#icon-..."> zarówno tutaj w HTML, jak i z JS
       (render/icons.js) w panelach budowanych dynamicznie. -->
  <svg style="display:none" aria-hidden="true">
    <defs>
      <!-- Grafiki jednostek/budynków gracza mają teraz osobne PNG (assets/) -
           te ikony liniowe zostają tylko jako fallback dla typów bez własnej
           grafiki (jednostki tatarskie) i dla akcji UI (anuluj). -->
      <symbol id="icon-tatar-raiders" viewBox="0 0 24 24"><path d="M5 20c3-6 8-12 13-16M18 4l2 .8M18 4l-.8 2M6 19l-1 2 2-1"/></symbol>
      <symbol id="icon-tatar-elite" viewBox="0 0 24 24"><path d="M4 18h16l-1-8-4 4-3-6-3 6-4-4z"/></symbol>
      <symbol id="icon-cancel" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    </defs>
  </svg>
  <div id="app">
    <header id="hud">
      <div class="hud-title">
        <h1>Małopolska 4X</h1>
        <p class="hud-subtitle">Najazdy tatarskie</p>
      </div>
      <div id="hud-stats">
        <span class="hud-stat"><img class="icon-img" src="assets/ui/hourglass.png" alt=""><span id="hud-turn">Czas —</span></span>
        <span class="hud-stat"><img class="icon-img" src="assets/ui/gold.png" alt=""><span id="hud-gold">Złoto —</span></span>
        <span id="hud-status"></span>
        <button id="new-game-btn" title="Rozpocznij misję od nowa">Nowa gra</button>
        <button id="speed-btn" title="Przełącz prędkość symulacji">1×</button>
        <button id="pause-btn" title="Wstrzymaj/wznów symulację">Pauza</button>
      </div>
    </header>
    <div id="order-hint" hidden>
      <span id="order-hint-text"></span>
      <button id="order-cancel-btn"><svg class="icon"><use href="#icon-cancel"></use></svg>Anuluj wybór</button>
    </div>
    <main id="board-wrap">
      <svg id="hex-map" role="img" aria-label="Mapa Małopolski"></svg>
      <aside id="side-panel" hidden></aside>
    </main>
    <footer id="event-log">
      <h2>Kronika</h2>
      <ul id="event-log-list"></ul>
    </footer>
  </div>
  <div id="end-screen" hidden></div>
  <div id="briefing" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
